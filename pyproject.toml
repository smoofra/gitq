[project]
name = "gitq"
version = "0.0.10"
description = "git based patch manager"
authors = [
    {name = "Lawrence D'Anna",email = "larry@elder-gods.org"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3,<7.0.0",
]

[project.urls]
Homepage = "https://github.com/smoofra/gitq"

[project.scripts]
git-swap = "gitq.git_swap:main"
git-queue = "gitq.git_queue:main"
git-squash = "gitq.git_squash:main"
git-edit = "gitq.git_edit:main"
git-split = "gitq.git_split:main"
git-drop = "gitq.git_drop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitq"]

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2.0.0",
    "black>=25.9.0,<26.0.0",
    "flake8>=7.3.0,<8.0.0",
    "pytest>=8.4.2,<9.0.0",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20250915,<7.0.0.0",
    "coverage>=7.13.5",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.coverage.run]
source = ["gitq"]
parallel = true
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
check_untyped_defs = true

[tool.uv]
check-url = "https://pypi.org/simple/"
keyring-provider = "subprocess"
